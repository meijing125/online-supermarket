{% extends "base.html" %}
{% block title %}支付成功 - 臻品汇{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="mb-4"><div class="success-circle mx-auto"><i class="bi bi-check-lg text-white" style="font-size:2.8rem;"></i></div></div>
            <h2 class="fw-bold mb-2">🎉 支付成功</h2>
            <p class="text-muted mb-4">感谢您的购买，我们将尽快为您安排发货</p>
            <div class="card-elevated p-4 text-start mb-4">
                <div class="d-flex justify-content-between mb-2"><span class="text-muted">订单编号</span><span class="fw-bold">#{{ order_id }}</span></div>
                <div class="d-flex justify-content-between mb-2"><span class="text-muted">支付金额</span><span class="fw-bold" style="font-size:1.3rem;color:#dc2626;">¥{{ "%.2f"|format(total) }}</span></div>
                <div class="d-flex justify-content-between mb-2"><span class="text-muted">支付状态</span><span class="badge bg-success" style="border-radius:20px;">✓ 已支付</span></div>
                <div class="d-flex justify-content-between"><span class="text-muted">预计发货</span><span>1-3 个工作日</span></div>
            </div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{{ url_for('index') }}" class="btn btn-dark btn-lg px-5" style="border-radius:12px;"><i class="bi bi-shop me-2"></i>继续购物</a>
                <a href="{{ url_for('cart') }}" class="btn btn-outline-dark btn-lg px-4" style="border-radius:12px;"><i class="bi bi-bag me-2"></i>查看购物车</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
