{% extends "base.html" %}
{% block title %}注册 - 臻品汇{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus display-4" style="color:var(--gold);"></i>
                <h2 class="fw-bold mt-2">创建账户</h2>
                <p class="text-muted">加入臻品汇，开启品质生活</p>
            </div>
            <div class="card-elevated p-4">
                {% if error %}<div class="alert alert-danger border-0" style="border-radius:10px;">{{ error }}</div>{% endif %}
                <form method="POST" action="{{ url_for('register') }}" onsubmit="return document.getElementById('password').value===document.getElementById('confirm_password').value||(alert('两次密码不一致'),!1)">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" name="username" placeholder="至少 3 个字符" minlength="3" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="至少 6 个字符" minlength="6" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 mb-3" style="border-radius:12px;">注 册</button>
                </form>
                <div class="text-center"><span class="text-muted">已有账户？</span><a href="{{ url_for('login') }}" style="color:var(--gold);" class="fw-semibold ms-1">立即登录 →</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
