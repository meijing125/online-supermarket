{% extends "base.html" %}
{% block title %}登录 - 臻品汇{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-gem display-4" style="color:var(--gold);"></i>
                <h2 class="fw-bold mt-2">臻品汇</h2>
                <p class="text-muted">欢迎回来，登录您的账户</p>
            </div>
            <div class="card-elevated p-4">
                {% if success %}<div class="alert alert-success border-0" style="border-radius:10px;">{{ success }}</div>{% endif %}
                {% if error %}<div class="alert alert-danger border-0" style="border-radius:10px;"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>{% endif %}
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" name="username" placeholder="请输入用户名" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 mb-3" style="border-radius:12px;">登 录</button>
                </form>
                <div class="text-center"><span class="text-muted">还没有账户？</span><a href="{{ url_for('register') }}" style="color:var(--gold);" class="fw-semibold ms-1">立即注册 →</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
